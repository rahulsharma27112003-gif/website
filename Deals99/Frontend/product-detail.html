<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Deals99</title>
  <meta name="description" content="View complete product details and recommended products on Deals99.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="site-header" data-active="products"></div>
  <main class="site-main">
    <section class="section product-detail-section">
      <div class="container">
        <div id="productDetailStatus" class="text-center py-5">
          <i class="fas fa-spinner fa-spin fa-2x text-primary" aria-hidden="true"></i>
          <p class="mt-3">Loading product details...</p>
        </div>
        <article id="productDetail" class="product-detail" hidden></article>
      </div>
    </section>

    <section class="section pt-0" aria-labelledby="recommendedTitle">
      <div class="container">
        <div class="d-flex justify-content-between align-items-end mb-4">
          <div>
            <p class="eyebrow mb-2">You may also like</p>
            <h2 id="recommendedTitle" class="mb-0">Recommended Products</h2>
          </div>
          <a class="btn btn-outline-primary" href="products.html">View all products</a>
        </div>
        <div id="recommendedProducts" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
          <div class="col-12 text-muted">Loading recommendations...</div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="components/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="script.js"></script>
  <script type="module" src="pages/product-detail.js"></script>
</body>
</html>
